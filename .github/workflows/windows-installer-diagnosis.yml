name: Windows controller file API probe
on:
  push:
    branches: [diagnose/windows-installer]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Inspect replacement behavior with open target handles
        shell: python
        run: |
          import ctypes, json, pathlib, tempfile
          from ctypes import wintypes as W
          K = ctypes.WinDLL('kernel32', use_last_error=True)
          K.CreateFileW.argtypes = [W.LPCWSTR,W.DWORD,W.DWORD,W.LPVOID,W.DWORD,W.DWORD,W.HANDLE]
          K.CreateFileW.restype = W.HANDLE
          K.MoveFileExW.argtypes = [W.LPCWSTR,W.LPCWSTR,W.DWORD]
          K.MoveFileExW.restype = W.BOOL
          K.CloseHandle.argtypes = [W.HANDLE]
          K.CloseHandle.restype = W.BOOL
          for label, access in [('none',0),('attributes',0x80),('read_control',0x20000),('generic_read',0x80000000)]:
              with tempfile.TemporaryDirectory(prefix='mihomo-reader-api-') as d:
                  target, source = pathlib.Path(d)/'record.json', pathlib.Path(d)/'replacement.json'
                  target.write_bytes(b'old')
                  source.write_bytes(b'new')
                  handle = K.CreateFileW(str(target),access,7,None,3,0x00200000,None)
                  if handle == ctypes.c_void_p(-1).value:
                      raise ctypes.WinError(ctypes.get_last_error())
                  try:
                      ctypes.set_last_error(0)
                      success = bool(K.MoveFileExW(str(source),str(target),1))
                      error = ctypes.get_last_error() if not success else 0
                      print(json.dumps({'access':label,'share':7,'replacedWhileOpen':success,'winError':error}),flush=True)
                  finally:
                      if not K.CloseHandle(handle):
                          raise ctypes.WinError(ctypes.get_last_error())
                  assert target.read_bytes() == (b'new' if success else b'old')
