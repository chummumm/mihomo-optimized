name: Windows medium-token volume path probe

on:
  push:
    branches: [diagnose/windows-installer]

permissions:
  contents: read

jobs:
  native-volume-probe:
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the original token fixture
        uses: actions/checkout@v4
        with:
          ref: 31b974cd2cb7edc1f12d5b6d7cd0963ad121288e
          persist-credentials: false
      - name: Check out this diagnostic probe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the original Windows token bindings
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pywin32==311
      - name: Probe real roots and supervisor-owned SUBST aliases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path artifacts/verification | Out-Null
          & python diagnostic-source/.github/diagnostics/volume-path-probe.py 2>&1 | Tee-Object -FilePath artifacts/verification/volume-native-probe.log
          $probeExit = $LASTEXITCODE
          Write-Output "NATIVE_VOLUME_PROBE_EXIT=$probeExit"
          exit $probeExit
      - name: Retain native token and API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-medium-volume-native-probe
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 7
