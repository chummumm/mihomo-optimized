name: Windows custom-path repair and removal diagnosis

on:
  push:
    branches: [diagnose/windows-installer]

permissions:
  contents: read
  actions: read

jobs:
  diagnose-custom-paths:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@v4
        with:
          ref: 882d416355513b55409a879547d33ed825441418
          persist-credentials: false

      - name: Check out this diagnostic commit separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the fixed Windows test dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pywin32==311

      - name: Download the exact fourth candidate
        uses: actions/download-artifact@v4
        with:
          name: mihomo-desktop-windows-x64
          run-id: 45658312465
          github-token: ${{ github.token }}
          path: artifacts/desktop

      - name: Recreate diagnostic metadata and overlay the reviewed test corrections
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ['GITHUB_WORKSPACE'])
          distribution = root / 'artifacts' / 'desktop'
          info_path = distribution / 'build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8-sig'))
          source = '882d416355513b55409a879547d33ed825441418'
          setup = distribution / 'mihomo-desktop-0.2.14-windows-x64-setup.exe'
          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          if (info.get('uiCommit') != source or info.get('desktopVersion') != '0.2.14'
                  or sha(setup) != '445cffd0ed5534a05c73008decb2e8f4e21b56d3c19669281312b277f4f8c14e'):
              raise RuntimeError('Candidate source or installer bytes differ from the fourth CI run')
          # Reproduce scripts/build-native-desktop.py's generated allowlist;
          # metadata and package checksums are verified again by load_candidate.
          generated = root / 'desktop' / 'generated'
          generated.mkdir(parents=True, exist_ok=True)
          names = sorted(set(info['runtimeFiles']) | {
              'resources/build-info.json', 'uninstall.exe',
              'mscordaccore_amd64_amd64_10.0.1426.52326.dll',
          })
          (generated / 'installer-files.json').write_text(
              json.dumps({'files': names}, ensure_ascii=False) + '\n', encoding='utf-8')
          provenance = {
              'partialDiagnostic': True,
              'candidateSource': source,
              'candidateRunId': 45658312465,
              'candidateArtifactId': 15046225380,
              'candidateInstallerSha256': sha(setup),
              'diagnosticCommit': os.environ['GITHUB_SHA'],
              'testOverlays': [],
          }
          for name in ('custom_install_smoke.py', 'upgrade_tun_smoke.py'):
              target = root / 'desktop' / 'tests' / name
              diagnostic = root / 'diagnostic-source' / 'desktop' / 'tests' / name
              before = sha(target)
              shutil.copyfile(diagnostic, target)
              provenance['testOverlays'].append({
                  'path': 'desktop/tests/' + name, 'candidateSourceSha256': before,
                  'diagnosticSha256': sha(target),
              })
          harness = root / 'diagnostic-source' / '.github' / 'diagnostics' / 'full-custom-path-diagnosis.py'
          provenance['harnessSha256'] = sha(harness)
          reports = root / 'artifacts' / 'verification'
          reports.mkdir(parents=True, exist_ok=True)
          (reports / 'full-custom-path-provenance.json').write_text(
              json.dumps(provenance, ensure_ascii=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(provenance, ensure_ascii=True, indent=2), flush=True)

      - name: Run original custom path cases with one explicit baseline omission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $harness = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-source/.github/diagnostics/full-custom-path-diagnosis.py'
          $log = Join-Path $env:GITHUB_WORKSPACE 'artifacts/verification/full-custom-path-console.log'
          & python $harness 2>&1 | Tee-Object -FilePath $log
          $diagnosticExit = $LASTEXITCODE
          Write-Output "PARTIAL_CUSTOM_PATH_DIAGNOSTIC_EXIT=$diagnosticExit"
          exit $diagnosticExit

      - name: Retain partial diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-custom-path-diagnosis
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 7
