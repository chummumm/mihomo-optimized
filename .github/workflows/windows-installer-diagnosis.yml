name: Windows shell and UIA startup diagnosis

on:
  push:
    branches: [diagnose/windows-installer]

permissions:
  contents: read
  actions: read

jobs:
  diagnose-startup:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      CARGO_INCREMENTAL: 0
      GOTOOLCHAIN: local
      RUSTFLAGS: -C target-feature=+crt-static
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the unchanged production source
        uses: actions/checkout@v4
        with:
          ref: e544948cca3449c4ea8a6f37e3d0df2be7084ed8
          persist-credentials: false

      - name: Check out this diagnostic commit separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false

      - name: Install the same SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Observe the original shell command then the unchanged UIA contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $harness = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-source/.github/diagnostics/windows-startup-diagnosis.py'
          & python $harness --workspace $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE

      - name: Retain scoped startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnosis
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 7
