name: Windows desktop

on:
  push:
    branches: [clash-dashboard]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [clash-dashboard]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and exercise Windows x64 desktop
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      GOTOOLCHAIN: local
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Verify transparent shell controls receive pointer hits
        timeout-minutes: 3
        run: dotnet run --project desktop/tests/shell/ShellTests.csproj -c Release
      - name: Verify native backdrop snapshot pixels and cancellation
        timeout-minutes: 3
        run: dotnet run --project desktop/tests/backdrop/BackdropTests.csproj -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows PowerShell UIA result contract
        run: python desktop/tests/windows_smoke.py --uia-json-contract
      - name: Read pinned core source
        id: core
        shell: pwsh
        run: |
          $core = Get-Content desktop/core.json -Raw | ConvertFrom-Json
          if ($core.repository -ne 'chummumm/mihomo-optimized' -or $core.commit -notmatch '^[a-f0-9]{40}$') { throw 'Invalid core source pin' }
          "sha=$($core.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: chummumm/mihomo-optimized
          ref: ${{ steps.core.outputs.sha }}
          path: core-src
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26'
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache-dependency-path: core-src/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Exercise native protocol boundaries and cancellation
        run: dotnet run --project desktop/tests/protocol/ProtocolTests.csproj -c Release
      - name: Install native Windows installer compiler
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'mihomo-nsis-3.11'
          # Published SHA-256: https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11.zip/download
          $expectedSha256 = 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1'
          curl.exe --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 --retry-all-errors --output $archive 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
          if ($LASTEXITCODE -ne 0) { throw "NSIS 3.11 download failed with exit code $LASTEXITCODE" }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expectedSha256) { throw 'NSIS 3.11 archive SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $nsisDirectory = Join-Path $destination 'nsis-3.11'
          $compiler = Join-Path $nsisDirectory 'makensis.exe'
          $version = & $compiler /VERSION
          if ($LASTEXITCODE -ne 0 -or ([string]$version).Trim() -cne 'v3.11') { throw "Unexpected NSIS compiler version: $version" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nsisDirectory -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NSISDIR=$nsisDirectory" -Encoding utf8
          Write-Host "Verified NSIS $version ($expectedSha256)"
      - name: Install Windows acceptance API bindings
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pywin32==311 pyflakes==3.4.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pyflakes desktop/tests/windows_smoke.py
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the unchanged web dashboard
        shell: pwsh
        run: |
          pnpm typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test:unit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the pinned original design for visual comparison
        shell: pwsh
        run: |
          python desktop/tests/prepare-visual-reference.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location artifacts/reference-source
          try {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            pnpm exec vite build --mode desktop --outDir dist-desktop
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Exercise managed core and resource bootstrap on Windows
        working-directory: core-src
        # Reduce contention around the pinned tests' short wall-clock deadlines.
        # Keep every package, assertion, deadline and uncached execution intact.
        run: go test -p 1 -tags with_gvisor -count=1 -timeout=5m ./component/desktop ./component/resource ./component/http ./component/dialer ./component/resolver ./component/profile/cachefile ./adapter/provider ./adapter/outboundgroup ./config ./hub/executor ./hub/route . -run 'Desktop|ResourceBootstrap|ReadSelectedSnapshot'
      - name: Verify EasyTier LAN preparation and ordinary TCP deadlines
        working-directory: core-src
        run: go test -p 1 -tags with_gvisor -count=1 -timeout=5m ./component/easytier ./context ./adapter/outbound ./tunnel -run 'EasyTier|DialBudget|TCPDial|TCPFirst|LAN'
      - name: Verify Windows TUN health, recovery and native route inspection
        working-directory: core-src
        run: go test -p 1 -tags with_gvisor -count=1 -timeout=5m ./listener ./listener/sing_tun ./hub/executor ./hub/route ./component/lanpreconnect -run 'Desktop|LAN'
      - name: Verify proxy IP destinations and DNS address-family output
        working-directory: core-src
        run: go test -p 1 -tags with_gvisor -count=1 -timeout=5m ./adapter ./adapter/provider ./dns ./config ./tunnel -run 'ProxyTarget|ProxyForceIP|TargetIPFamily|AnswerIPFamily|ProviderTargetFamily'
      - name: Verify EasyTier background preparation before delayed LAN traffic
        working-directory: core-src
        env:
          MIHOMO_EASYTIER_INTEGRATION: '1'
        run: go test -p 1 -tags with_gvisor -count=1 -v -timeout=120s ./adapter/outbound -run '^(TestEasyTierFirstDialWaitsForDelayedRelayRoute|TestLANEasyTierSubnetPreparesBeforeBusiness)$'
      - name: Verify native WireGuard and AmneziaWG preparation before business traffic
        working-directory: core-src
        env:
          MIHOMO_LAN_INTEGRATION: '1'
        run: go test -p 1 -tags with_gvisor -count=1 -v -timeout=90s ./adapter/outbound -run '^TestLANWireGuardNativePreparationBeforeBusiness$'
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-native-windows-msvc-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: desktop-native-windows-msvc-v2-
      - name: Build and stage fixed companion programs
        run: python scripts/prepare-desktop.py --core-dir core-src
      - name: Exercise native settings and update policies
        working-directory: src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib
      - name: Build native WPF application, host and NSIS installer
        run: python scripts/build-native-desktop.py
      - name: Assemble installer and portable distribution
        run: python scripts/package-desktop.py
      - name: Cache completed Windows compilation
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      # Preserve the compiled candidate if system integration fails. Publishing
      # remains gated on every test in this build job passing.
      - name: Upload Windows installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-desktop-windows-x64
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 30
      - name: Test real Windows core authentication, proxying and exit
        run: python desktop/tests/core_smoke.py --core src-tauri/binaries/mihomo-core-x86_64-pc-windows-msvc.exe
      - name: Test real Windows bootstrap groups, offline cache and cancellation
        run: python core-src/scripts/test-resource-bootstrap.py --core src-tauri/binaries/mihomo-core-x86_64-pc-windows-msvc.exe --report artifacts/verification/resource-bootstrap-core.json
      - name: Test 0.1.1 uninstall recovery and direct 0.1.7 native migration
        run: ./desktop/tests/setup-windows.ps1
      - name: Test installed native UI, system proxy, TUN forwarding and cleanup
        run: python desktop/tests/windows_smoke.py
      - name: Render original design with the same Windows fixtures and dimensions
        if: ${{ !cancelled() && (success() || failure()) }}
        env:
          REFERENCE_SOURCE: artifacts/reference-source
          REFERENCE_FIXTURE: artifacts/verification/visual-fixture.json
          REFERENCE_OUTPUT: artifacts/verification/reference
          REFERENCE_ALLOW_PARTIAL: ${{ job.status == 'failure' && '1' || '0' }}
        run: |
          if (Test-Path artifacts/verification/visual-fixture.json) {
            node desktop/tests/capture-reference.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:REFERENCE_ALLOW_PARTIAL -ne '1') {
            throw 'The successful native acceptance run did not export its visual fixture.'
          }
      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-verification
          path: artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attest and publish desktop release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/clash-dashboard'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mihomo-desktop-windows-x64
          path: artifacts/desktop
      - name: Use the same pinned verifier as the desktop application
        run: python3 scripts/prepare-release-verifier.py
      - name: Validate release version and source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/desktop-release.py prepare
      - name: Create build provenance for installer and portable archive
        id: attest
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            artifacts/desktop/*-setup.exe
            artifacts/desktop/*-portable.zip
      - name: Verify production signing policy and reject tampering
        if: steps.release.outputs.publish == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          INSTALLER: ${{ steps.release.outputs.installer }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "$INSTALLER.sigstore.json"
          gh attestation verify "$INSTALLER" --bundle "$INSTALLER.sigstore.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/windows-desktop.yml" --source-ref refs/heads/clash-dashboard --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --custom-trusted-root src-tauri/resources/trusted-root.jsonl --format json > artifacts/desktop/provenance-verification.json
          python3 -c 'import json; rows=json.load(open("artifacts/desktop/provenance-verification.json")); assert any(r["verificationResult"]["signature"]["certificate"].get("sourceRepositoryIdentifier")=="1410715865" for r in rows), "Repository identity mismatch"'
          cp "$INSTALLER" "$RUNNER_TEMP/tampered-installer.exe"
          printf 'tampered' >> "$RUNNER_TEMP/tampered-installer.exe"
          if gh attestation verify "$RUNNER_TEMP/tampered-installer.exe" --bundle "$INSTALLER.sigstore.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/windows-desktop.yml" --source-ref refs/heads/clash-dashboard --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --custom-trusted-root src-tauri/resources/trusted-root.jsonl >/dev/null 2>&1; then
            echo 'Tampered installer was accepted' >&2
            exit 1
          fi
          python3 scripts/package-desktop.py --checksums-only
      - name: Publish desktop without changing the core latest release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/desktop-release.py publish
