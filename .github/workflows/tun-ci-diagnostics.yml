name: Validate atomic update completion
on:
  push:
    branches: [diagnostics/windows-tun-ci-43368503742]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: ${{ matrix.os == 'windows-2022' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 88913fb12efcdbfbc74eb5840d477744b1fbca9f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python static checker
        run: python -m pip install pyflakes==3.4.0
      - name: Validate source and fixture contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/desktop-release-notes.py scripts/prepare-desktop.py scripts/prepare-core-update-baseline.py desktop/tests/core_update_smoke.py desktop/tests/core_update_fixture_test.py desktop/tests/upgrade_tun_smoke.py desktop/tests/upgrade_tun_native.py desktop/tests/upgrade_tun_http_test.py
          python -m pyflakes scripts/desktop-release-notes.py scripts/prepare-desktop.py scripts/prepare-core-update-baseline.py desktop/tests/core_update_smoke.py desktop/tests/core_update_fixture_test.py desktop/tests/upgrade_tun_smoke.py desktop/tests/upgrade_tun_native.py desktop/tests/upgrade_tun_http_test.py
          python desktop/tests/upgrade_tun_http_test.py
          python desktop/tests/core_update_fixture_test.py
      - name: Install pinned Rust compiler and formatter
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Reuse existing Windows compilation cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-native-windows-msvc-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: desktop-native-windows-msvc-v2-
      - name: Check Rust source format
        working-directory: src-tauri
        run: cargo +1.99.1 fmt --all -- --check
      - name: Exercise portable and native library contracts
        working-directory: src-tauri
        run: cargo +1.99.1 test --locked --lib
