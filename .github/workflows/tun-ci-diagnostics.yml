name: Validate controller discovery fixtures
on:
  push:
    branches: [diagnostics/windows-tun-ci-43368503742]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 9c56ff98cfebbbe8ccf0c47ea9d52ae91243f2da
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python static checker
        run: python -m pip install pyflakes==3.4.0
      - name: Validate discovery, native table and HTTP contracts
        run: |
          python -m py_compile desktop/tests/upgrade_tun_smoke.py desktop/tests/upgrade_tun_native.py desktop/tests/upgrade_tun_http_test.py
          python -m pyflakes desktop/tests/upgrade_tun_smoke.py desktop/tests/upgrade_tun_native.py desktop/tests/upgrade_tun_http_test.py
          python desktop/tests/upgrade_tun_http_test.py
