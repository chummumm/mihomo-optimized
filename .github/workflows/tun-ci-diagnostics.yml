name: Inspect saved automatic update restoration
on:
  push:
    branches: [diagnostics/windows-tun-ci-43368503742]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download existing failed-run evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14018855631'
          path: evidence
          merge-multiple: true
          repository: chummumm/mihomo-optimized
          run-id: '43383468432'
          github-token: ${{ github.token }}
      - name: Read bounded saved rejection state
        shell: python
        run: |
          import json, re
          from pathlib import Path
          root = Path('evidence')
          files = [p for p in root.rglob('*') if p.is_file()]
          print('ARTIFACT_FILES', json.dumps([{'name': str(p.relative_to(root)), 'bytes': p.stat().st_size} for p in files]))
          path = next(root.rglob('core-update.json'))
          assert 0 < path.stat().st_size <= 1024 * 1024
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          def clean(value):
              if isinstance(value, dict):
                  return {key: ('<redacted>' if key.lower() in ('secret', 'token', 'password', 'authorization') else clean(item)) for key, item in value.items()}
              if isinstance(value, list):
                  return [clean(item) for item in value]
              if isinstance(value, str):
                  value = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', value)
                  value = re.sub(r'https?://[^\s\"<>]+', '<url>', value)
                  value = re.sub(r'(?i)(authorization|secret|token|password)(\s*[=:]\s*)[^\s,;]+', r'\1\2<redacted>', value)
                  return value[-20000:]
              return value
          out = {key: data.get(key) for key in ('stage', 'passed', 'tests', 'diagnostics', 'unsupportedPublishedCore', 'baseline', 'scenarios')}
          print('CORE_UPDATE_SAVED_EVIDENCE_BEGIN')
          print(json.dumps(clean(out), ensure_ascii=True, indent=2))
          print('CORE_UPDATE_SAVED_EVIDENCE_END')
