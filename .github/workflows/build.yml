name: Build mihomo-optimized

on:
  push:
    branches: [main]
    tags: ["mihomo-optimized-v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.markdown"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "Meta.png"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.markdown"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "Meta.png"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release for this main-branch commit
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build after a tested upstream merge
        type: string
        default: ""
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: optimized-build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  SKIP_INTEROP_TEST: "1"
  SKIP_CONCURRENT_TEST: "1"

jobs:
  check:
    name: Core, DNS and release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_time: ${{ steps.version.outputs.build_time }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Identify the exact build
        id: version
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          is_uint64() {
            [[ "$1" =~ ^(0|[1-9][0-9]*)$ ]] &&
              { (( ${#1} < 20 )) || { (( ${#1} == 20 )) && [[ "$1" < 18446744073709551615 || "$1" == 18446744073709551615 ]]; }; }
          }
          verify_release_tag() {
            local tag=$1 expected=$2 allow_missing=$3 refs status sha ref extra object= peeled=
            if refs=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
              while IFS=$'\t' read -r sha ref extra; do
                [[ "$sha" =~ ^[0-9a-f]{40}$ && -z "$extra" ]] || return 1
                case "$ref" in
                  "refs/tags/$tag") [[ -z "$object" ]] || return 1; object=$sha ;;
                  "refs/tags/$tag^{}") [[ -z "$peeled" ]] || return 1; peeled=$sha ;;
                  *) return 1 ;;
                esac
              done <<< "$refs"
              [[ -n "$object" && "${peeled:-$object}" == "$expected" ]] || {
                printf 'Release tag %s is not build %s. Bump PROJECT_VERSION for a new source commit.\n' "$tag" "$expected" >&2
                return 1
              }
            else
              status=$?
              if (( status == 2 )) && [[ "$allow_missing" == true ]]; then
                return 0
              fi
              printf 'Cannot verify release tag %s (git status %s); refusing to publish.\n' "$tag" "$status" >&2
              return 1
            fi
          }
          commit=$(git rev-parse HEAD)
          upstream=$(cat UPSTREAM_VERSION)
          [[ "$upstream" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Invalid UPSTREAM_VERSION' >&2; exit 1; }
          for component in "${BASH_REMATCH[@]:1}"; do
            is_uint64 "$component" || { echo 'UPSTREAM_VERSION components must be canonical uint64 values' >&2; exit 1; }
          done
          project=$(cat PROJECT_VERSION)
          [[ "$project" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Invalid PROJECT_VERSION' >&2; exit 1; }
          for component in "${BASH_REMATCH[@]:1}"; do
            is_uint64 "$component" || { echo 'PROJECT_VERSION components must be canonical uint64 values' >&2; exit 1; }
          done
          version="mihomo-optimized-v${project}"
          release_tag="$version"
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            [[ "$EVENT_REF_NAME" == "$release_tag" ]] || { echo 'Tag does not match PROJECT_VERSION' >&2; exit 1; }
          fi
          verify_release_tag "$release_tag" "$commit" true
          {
            printf 'commit=%s\n' "$commit"
            printf 'version=%s\n' "$version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'build_time=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install package inspection and network test tools
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd fakeroot iproute2 nftables ethtool
      - name: Select compile checks or the complete release matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          matrix_args=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            matrix_args=(--profile pr)
          fi
          build_matrix_json=$(python3 scripts/release-build.py matrix "${matrix_args[@]}")
          printf 'matrix=%s\n' "$build_matrix_json" >> "$GITHUB_OUTPUT"
      - name: Verify transparent capture, REDIRECT traffic and TUN blackholes in isolated namespaces
        run: |
          set -euo pipefail
          network_test_binary="$RUNNER_TEMP/transparent-proxy.test"
          trap 'rm -f "$network_test_binary"' EXIT
          CGO_ENABLED=0 go test -tags with_gvisor -c -o "$network_test_binary" ./component/transparentproxy
          sudo -n env MIHOMO_TRANSPARENT_PROXY_INTEGRATION=1 TMPDIR=/tmp \
            "$network_test_binary" -test.run '^(TestNFTKernelRoundTrip|TestNFTRedirKernelTraffic|TestRoutesKernelBlackholeBarrier)$' -test.v -test.timeout 3m
      - name: Verify real IPv4 and IPv6 DNS TCP SYN probes in an isolated network
        run: |
          set -euo pipefail
          syn_test_binary="$RUNNER_TEMP/dns-tcp-syn.test"
          trap 'rm -f "$syn_test_binary"' EXIT
          CGO_ENABLED=0 go test -tags with_gvisor -c -o "$syn_test_binary" ./dns
          sudo -n bash scripts/test-dns-tcp-syn.sh "$syn_test_binary"
      - name: Verify actual core startup resources, SIGTERM and systemd stop cleanup
        run: |
          set -euo pipefail
          stop_test_binary="$RUNNER_TEMP/mihomo-stop-test"
          trap 'rm -f "$stop_test_binary"' EXIT
          CGO_ENABLED=0 go build -tags with_gvisor -o "$stop_test_binary" .
          sudo -n python3 scripts/test-transparent-stop.py --core "$stop_test_binary" --require-systemd
          python3 scripts/test-resource-bootstrap.py --core "$stop_test_binary" --report "$RUNNER_TEMP/resource-bootstrap-verification.json"
          python3 scripts/test-desktop-controller.py --core "$stop_test_binary"
      - name: Test fork changes and sync safeguards
        run: bash scripts/ci-check.sh test
      - name: Repeat real Debian upgrades with locally modified configuration
        timeout-minutes: 4
        run: |
          set -euo pipefail
          # Fresh fixtures on each run; any failure stops the release gate.
          for iteration in 1 2 3; do
            python3 scripts/test-release-build.py ReleaseTests.test_debian_rename_preserves_locally_modified_configuration
          done
      - name: Test configuration permissions with an unprivileged service user
        run: |
          set -euo pipefail
          permission_test_binary="$RUNNER_TEMP/config-file-permissions.test"
          trap 'rm -f "$permission_test_binary"' EXIT
          CGO_ENABLED=0 go test -tags with_gvisor -c -o "$permission_test_binary" ./hub/route
          sudo -n env MIHOMO_CONFIG_FILE_PERMISSION_REQUIRED=1 TMPDIR=/tmp \
            "$permission_test_binary" -test.run '^TestConfigFileUnprivilegedPermissions$' -test.v -test.timeout 2m

  pr-compile:
    name: Compile check (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install pinned Android NDK
        if: matrix.android
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is missing}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.14206865'
          printf 'ANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$sdk" >> "$GITHUB_ENV"
      - name: Compile and inspect the core without release artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release-build.py compile-check "$TARGET"

  build:
    name: Release (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install package inspection tools
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd fakeroot
      - name: Install pinned Android NDK
        if: matrix.android
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is missing}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.14206865'
          printf 'ANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$sdk" >> "$GITHUB_ENV"
      - name: Build, package and inspect the complete core with gVisor
        env:
          TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          BUILD_TIME: ${{ needs.check.outputs.build_time }}
        run: bash scripts/ci-check.sh build "$TARGET" "$RUNNER_TEMP/dist" "$BUILD_VERSION" "$BUILD_TIME"
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mihomo-${{ matrix.target }}-${{ needs.check.outputs.commit }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  updater-platforms:
    name: Core updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Verify native core replacement, rollback and macOS signing
        run: go test -tags with_gvisor -count=1 -timeout=5m ./component/updater ./component/resource ./component/mmdb ./component/geodata ./rules/provider
      - name: Repeat Windows startup routing and cancellation across scheduler settings
        if: runner.os == 'Windows'
        timeout-minutes: 3
        # Every iteration must pass. This is a stability gate, not a retry loop.
        run: go test -v -tags with_gvisor -count=25 -cpu=1,4 -shuffle=on -timeout=2m ./component/resource -run '^TestResourceBootstrap'
      - name: Verify native configuration editing and private UI staging
        run: go test -tags with_gvisor -count=1 -timeout=5m ./hub/route -run 'ConfigFile|UIUpdater|UnifiedUpgrade|UpgradeSchedule'
      - name: Verify desktop supervisor authentication, confinement and lifecycle contracts
        run: go test -tags with_gvisor -count=1 -timeout=3m ./component/desktop ./hub/route . -run Desktop
      - name: Set up Python for native Windows compatibility tests
        if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify managed controllers and Windows core/service compatibility
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          controller_test_binary="$RUNNER_TEMP/mihomo-controller-test"
          compat_fixture_binary="$RUNNER_TEMP/mihomo-tun-compat-fixture.test.exe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then controller_test_binary="$controller_test_binary.exe"; fi
          trap 'rm -f "$controller_test_binary" "$compat_fixture_binary"' EXIT
          CGO_ENABLED=0 go build -tags with_gvisor -o "$controller_test_binary" .
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/test-desktop-controller.py --core "$controller_test_binary" --require-tun
            CGO_ENABLED=0 go test -tags with_gvisor -c -o "$compat_fixture_binary" github.com/metacubex/sing-tun
            python scripts/test-windows-tun-compat.py --core "$controller_test_binary" --fixture "$compat_fixture_binary" --report "$RUNNER_TEMP/windows-tun-compat/report.json"
            python scripts/windows-cvr-service-compat/run.py --core "$controller_test_binary" --report "$RUNNER_TEMP/windows-tun-compat/cvr-service/report.json"
          else
            python3 scripts/test-desktop-controller.py --core "$controller_test_binary"
          fi
      - name: Preserve Windows compatibility evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-tun-compat-${{ github.sha }}
          path: ${{ runner.temp }}/windows-tun-compat/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify TUN snapshots, recovery operations and native Windows resource repair
        run: go test -p 1 -tags with_gvisor -count=1 -timeout=5m ./listener ./listener/sing_tun ./hub/executor ./hub/route -run 'Desktop|StandaloneWindowsTun|TunHealth|TunRecovery'
      - name: Verify exclusive Windows adapter creation and deterministic cleanup
        if: runner.os == 'Windows'
        env:
          MIHOMO_TUN_INTEGRATION: '1'
        run: go test -v -tags with_gvisor -count=1 -timeout=2m github.com/metacubex/sing-tun github.com/metacubex/sing-tun/internal/wintun -run Desktop
      - name: Verify native startup resource routing, cache isolation and cancellation
        run: go test -tags with_gvisor -count=1 -timeout=5m ./adapter/provider ./adapter/outboundgroup ./component/profile/cachefile ./component/dialer ./component/http ./component/resolver ./config ./hub/executor ./hub/route . -run 'ResourceBootstrap|ReadSelectedSnapshot'

  release:
    name: Publish GitHub release
    needs: [check, build, updater-platforms]
    if: >-
      github.repository == 'chummumm/mihomo-optimized' &&
      github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (startsWith(github.ref, 'refs/tags/') && github.ref_name == needs.check.outputs.release_tag) ||
       (inputs.publish_release && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: dns-release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Download all release targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mihomo-*-${{ needs.check.outputs.commit }}
          path: dist
          merge-multiple: true
      - name: Publish immutable commit build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.check.outputs.commit }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local tag=$1 expected=$2 allow_missing=$3 refs status sha ref extra object= peeled=
            if refs=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
              while IFS=$'\t' read -r sha ref extra; do
                [[ "$sha" =~ ^[0-9a-f]{40}$ && -z "$extra" ]] || return 1
                case "$ref" in
                  "refs/tags/$tag") [[ -z "$object" ]] || return 1; object=$sha ;;
                  "refs/tags/$tag^{}") [[ -z "$peeled" ]] || return 1; peeled=$sha ;;
                  *) return 1 ;;
                esac
              done <<< "$refs"
              [[ -n "$object" && "${peeled:-$object}" == "$expected" ]] || {
                printf 'Release tag %s is not build %s. Bump PROJECT_VERSION for a new source commit.\n' "$tag" "$expected" >&2
                return 1
              }
            else
              status=$?
              if (( status == 2 )) && [[ "$allow_missing" == true ]]; then
                return 0
              fi
              printf 'Cannot verify release tag %s (git status %s); refusing to publish.\n' "$tag" "$status" >&2
              return 1
            fi
          }
          verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" true
          python3 scripts/release-build.py collect dist "$BUILD_VERSION" "$BUILD_SHA"
          cd dist
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          assets=( ./*.gz ./*.zip ./*.deb ./*.rpm ./*.pkg.tar.zst BUILDINFO.json SHA256SUMS version.txt )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" false
            printf 'Release %s already exists; checking its immutable assets.\n' "$RELEASE_TAG"
          else
            {
              printf 'mihomo-optimized `%s`\n\n' "$BUILD_VERSION"
              printf 'Source commit: `%s`\n\n' "$BUILD_SHA"
              printf '%s\n\n' '## 本次更新：1.0.37

          - 修复 Windows 普通核心替换时，上游通用 GUID 的同名网卡被产品独占预检查拒绝的问题（issue #92）。普通核心恢复上游通用 GUID、Create / Open / StartSession 和 Windows 重试流程，支持第三方宿主使用 -d、-f、-ext-ctl-pipe 启动。
          - 只有显式 desktop-managed 的自家桌面保留专属身份与独占创建；管理员权限、Windows 服务和开启 TUN 本身不会切换模式。无需新增 YAML 配置。
          - 保留会话及部分配置失败的确定性清理、Wintun Close 修复、实际句柄身份检查和路由错误处理。替换前先由原宿主停止旧核心；普通模式采用上游原生同名处理，受管模式继续保护外部同名设备。
          - 新增真实 Wintun 创建者与实际核心命名管道启动验收，验证通用身份复用、活动会话保护和身份切换；另使用固定 SHA-256 的 Clash Verge Service IPC 2.7.7 正式服务验证核心启动、TUN 实际转发和停止。受管原生生命周期回归继续执行。

          [完整发行说明](https://github.com/chummumm/mihomo-optimized/blob/mihomo-optimized-v1.0.37/docs/releases.md) · [Windows 模式边界](https://github.com/chummumm/mihomo-optimized/blob/mihomo-optimized-v1.0.37/docs/desktop-managed.md#windows-tun-ownership-boundary)

          ## 1.0.36

          - 修复重启内核时 PnP 设备已移除、网络接口表仍残留旧记录导致的 native_identity_missing。单一产品专属 GUID、名称、虚拟接口类型和有效 LUID/索引匹配时，由 Windows 原生创建协调移除时序。
          - 保留 utun 名称、原生活跃拥有者排他和创建后句柄校验；同名不同 GUID、身份冲突及查询错误继续拒绝。不扩大 500 毫秒等待、不循环重启、不按名称接管已有网卡。
          - 增加固定残留快照的 Windows 原生回归，验证活跃拥有者保护及关闭后单次重建。配套桌面 0.2.12 增加连续 20 次完整重启与真实 TUN 转发验收。

          [完整发行说明](https://github.com/chummumm/mihomo-optimized/blob/mihomo-optimized-v1.0.36/docs/releases.md)

          ## 1.0.35

          - 受管内核自身原子绑定系统分配的控制端口，通过固定位置的有界启动记录交接实际地址；新版桌面核验本次启动标识、PID 与核心实例，再执行原有认证和就绪检查。
          - 控制端口绑定或记录发布失败会立即作为启动失败返回，并清理已创建资源；相同实例重载保留控制监听器。
          - 旧的明确非零控制端口模式继续兼容。完整消除桌面端口探测窗口需要安装配套桌面 0.2.11；旧客户端独立更新核心仍使用其原有启动方式。
          - 增加真实多实例、监听器保留、发布失败和 Windows TUN 启动清理验收，保留资源稳定性与全部原生生命周期检查。

          [启动交接协议](https://github.com/chummumm/mihomo-optimized/blob/mihomo-optimized-v1.0.35/docs/desktop-managed.md) · [完整发行说明](https://github.com/chummumm/mihomo-optimized/blob/mihomo-optimized-v1.0.35/docs/releases.md)

          ## 1.0.34

          - Windows TUN 对已核实的本产品设备直接进入 Wintun 原生创建流程，取消必须先观察到 phantom 的额外限制；关闭后的异步移除交由 Windows 协调，原生占用结果和错误码保留。
          - 按实际 NetCfgInstanceId 关联 PnP 身份并读取真实实例 ID；不同 GUID 的同名设备和身份不符继续受保护，不按名称打开接管。失败携带阶段与本次设备查询结果。
